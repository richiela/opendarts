;; Pytest config -- fast-by-default smoke tests, opt-in slow tier.
;;
;; Two ways to run the pytest suite:
;;
;;   pytest tests/           # DEFAULT: fast smoke tests only (seconds).
;;                           # Run this after every small change.
;;   pytest tests/ --slow    # FULL: everything, including slow-marked
;;                           # tests (real corpus replays, real
;;                           # subprocess lifecycles, multi-frame
;;                           # calibration solves). Run before merging
;;                           # to main.
;;
;; The --slow flag and the auto-skip live in tests/conftest.py.
[pytest]
markers =
    slow: slow test (real corpus replay, real subprocess lifecycle, heavy image/calibration work); skipped by default, enabled with --slow
